[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxguard"
version = "0.1.0"
description = "Training-free plugins that make voice agents reliable on numbers, names, pronunciation, and turn-taking, with a before/after benchmark for any model."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Sri Harsha Mudumba" }]
keywords = ["voice agents", "speech recognition", "speech-to-speech", "asr", "tts", "vad", "benchmark"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "httpx>=0.27",
  "websockets>=13",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
local = ["faster-whisper>=1.0"]
open = ["torch>=2.2", "transformers>=4.44"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
voxguard = "voxguard.cli:main"

[tool.setuptools.packages.find]
include = ["voxguard*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
