# All six providers, before and after the plugins.
#   source .env
#   voxguard bench --config configs/all_providers.toml
#   voxguard report
# To run providers in parallel instead, use one configs/run_<provider>.toml per terminal.
# Setup for ElevenLabs and Vapi: docs/PROVIDERS.md

[data]
cases = "data/cases.jsonl"

[run]
repeats = 1             # run the whole set N times; models are not deterministic
concurrency = 1
use_keyterms = true
out_dir = "runs"

[shadow]
type = "deepgram"       # second recognizer used by the plugins
model = "nova-3"

[[agents]]
type = "openai_realtime"
name = "OpenAI gpt-realtime"
model = "gpt-realtime"

[[agents]]
type = "gemini_live"
name = "Google Gemini Live 3.8"
model = "gemini-3.8-live"
response_modality = "AUDIO"

[[agents]]
type = "deepgram_agent"
name = "Deepgram Voice Agent (Nova-3)"
listen_model = "nova-3"
think_model = "gpt-4o-mini"

[[agents]]
type = "assemblyai_agent"
name = "AssemblyAI Voice Agent"

[[agents]]
type = "elevenlabs_agent"
name = "ElevenLabs Agents"
agent_id = "PASTE_AGENT_ID"

[[agents]]
type = "vapi"
name = "Vapi"
assistant_id = "PASTE_ASSISTANT_ID"
