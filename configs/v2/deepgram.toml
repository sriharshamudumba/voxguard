# v2 benchmark: 160 scripts (40 per entity type) x 4 accents = 640 turns per model.
# Run everything with scripts/run_v2.sh.

[data]
cases = "data/v2/cases.jsonl"

[run]
repeats = 1
concurrency = 3
use_keyterms = true
out_dir = "runs"

[shadow]
type = "deepgram"
model = "nova-3"

# smart_format is off by default in the Voice Agent API; Flux does not support it.
# gpt-6-luna is not usable here: Deepgram rejects reasoning_effort, and OpenAI rejects tools without it.
# Flux + gpt-4o-mini is the old-LLM control.

[[agents]]
type = "deepgram_agent"
name = "Deepgram Nova-3 + gpt-5.4-mini"
listen_model = "nova-3"
think_model = "gpt-5.4-mini"
think_options = { temperature = "omit" }

[[agents]]
type = "deepgram_agent"
name = "Deepgram Nova-3 smart_format + gpt-5.4-mini"
listen_model = "nova-3"
think_model = "gpt-5.4-mini"
think_options = { temperature = "omit" }
listen_options = { smart_format = true }

[[agents]]
type = "deepgram_agent"
name = "Deepgram Flux + gpt-5.4-mini"
listen_model = "flux-general-en"
think_model = "gpt-5.4-mini"
think_options = { temperature = "omit" }

[[agents]]
type = "deepgram_agent"
name = "Deepgram Flux + gemini-3.8-flash"
listen_model = "flux-general-en"
think_provider = "google"
think_model = "gemini-3.8-flash"

[[agents]]
type = "deepgram_agent"
name = "Deepgram Flux + gpt-4o-mini"
listen_model = "flux-general-en"
think_model = "gpt-4o-mini"
