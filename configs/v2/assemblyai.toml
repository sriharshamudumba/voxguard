# v2 benchmark: 160 scripts (40 per entity type) x 4 accents = 640 turns per model.
# Run everything with scripts/run_v2.sh.

[data]
cases = "data/v2/cases.jsonl"

[run]
repeats = 1
concurrency = 4
use_keyterms = true
out_dir = "runs"

[shadow]
type = "deepgram"
model = "nova-3"

[[agents]]
type = "assemblyai_agent"
name = "AssemblyAI Voice Agent"
